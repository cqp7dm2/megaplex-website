<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megaplex | Make Ideas Move</title>
    <meta
      name="description"
      content="Megaplex builds ideas with purpose, clarity and momentum."
    />
    <meta name="theme-color" content="#050a0d" />
    <link rel="canonical" href="https://megaplex.it.com/" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23050a0d%22/><text x=%2232%22 y=%2241%22 text-anchor=%22middle%22 fill=%22%235edfff%22 font-family=%22Arial%22 font-size=%2228%22 font-weight=%22700%22>M</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://megaplex.it.com/" />
    <meta property="og:title" content="Megaplex | Make Ideas Move" />
    <meta
      property="og:description"
      content="Megaplex builds ideas with purpose, clarity and momentum."
    />
    <meta property="og:image" content="https://megaplex.it.com/assets/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Megaplex | Make Ideas Move" />
    <meta
      name="twitter:description"
      content="Megaplex builds ideas with purpose, clarity and momentum."
    />
    <meta name="twitter:image" content="https://megaplex.it.com/assets/og.png" />

    <style>
      :root {
        color-scheme: dark;
        --white: #f7fbff;
        --soft-white: rgba(247, 251, 255, 0.68);
        --accent: #5edfff;
        --line: rgba(255, 255, 255, 0.16);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050a0d;
      }

      body {
        color: var(--white);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        isolation: isolate;
        display: flex;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        overflow: hidden;
        padding: clamp(24px, 4vw, 58px) clamp(22px, 6vw, 92px);
      }

      .backdrop {
        position: absolute;
        z-index: -2;
        inset: -3%;
        background: url("assets/megaplex-hero.png") 62% center / cover no-repeat;
        animation: drift 18s ease-in-out infinite alternate;
        will-change: transform;
      }

      .page::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(3, 7, 10, 0.96) 0%, rgba(3, 7, 10, 0.78) 37%, rgba(3, 7, 10, 0.18) 72%),
          linear-gradient(0deg, rgba(3, 7, 10, 0.72) 0%, transparent 42%, rgba(3, 7, 10, 0.3) 100%);
        content: "";
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        animation: reveal 0.8s ease-out both;
      }

      .logo {
        font-size: 0.9rem;
        font-weight: 750;
        letter-spacing: 0.22em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--soft-white);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(94, 223, 255, 0.52);
        content: "";
        animation: pulse 2.4s ease-out infinite;
      }

      .hero {
        display: flex;
        max-width: 850px;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding-bottom: 2vh;
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-size: clamp(3.8rem, 8.7vw, 8.8rem);
        font-weight: 650;
        letter-spacing: -0.075em;
        line-height: 0.88;
      }

      h1 span {
        display: block;
        color: var(--accent);
      }

      .line {
        display: block;
        overflow: hidden;
      }

      .line:first-child > span {
        color: var(--white);
      }

      .line > span {
        display: block;
        animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .line:nth-child(2) > span {
        animation-delay: 0.12s;
      }

      .intro {
        max-width: 420px;
        margin: clamp(24px, 3vh, 34px) 0 0;
        color: var(--soft-white);
        font-size: clamp(1rem, 1.25vw, 1.15rem);
        line-height: 1.65;
        animation: reveal 0.8s 0.42s ease-out both;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(247, 251, 255, 0.48);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        animation: reveal 0.8s 0.58s ease-out both;
      }

      .footer p {
        margin: 0;
      }

      .footer-line {
        width: clamp(46px, 8vw, 120px);
        height: 1px;
        margin-right: auto;
        margin-left: 18px;
        background: var(--line);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(110%);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes drift {
        from {
          transform: scale(1.03) translate3d(-0.5%, 0, 0);
        }
        to {
          transform: scale(1.09) translate3d(0.8%, -0.5%, 0);
        }
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(94, 223, 255, 0.5);
        }
        65%,
        100% {
          box-shadow: 0 0 0 9px rgba(94, 223, 255, 0);
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 24px;
        }

        .backdrop {
          background-position: 67% center;
        }

        .page::before {
          background:
            linear-gradient(90deg, rgba(3, 7, 10, 0.9), rgba(3, 7, 10, 0.42)),
            linear-gradient(0deg, rgba(3, 7, 10, 0.88) 0%, transparent 55%, rgba(3, 7, 10, 0.4) 100%);
        }

        .status {
          font-size: 0.65rem;
          letter-spacing: 0.1em;
        }

        h1 {
          font-size: clamp(3.7rem, 18vw, 6.4rem);
        }

        .intro {
          max-width: 320px;
          font-size: 1rem;
        }

        .footer-line {
          display: none;
        }
      }

      @media (max-height: 590px) {
        .page {
          padding-top: 20px;
          padding-bottom: 20px;
        }

        h1 {
          font-size: clamp(3.4rem, 10vw, 6.4rem);
        }

        .intro {
          margin-top: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="backdrop" aria-hidden="true"></div>

      <header class="header">
        <a class="logo" href="./" aria-label="Megaplex home">MEGAPLEX</a>
        <div class="status">Coming soon</div>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">
          <span class="line"><span>Make ideas</span></span>
          <span class="line"><span>move.</span></span>
        </h1>
        <p class="intro">Building bold ideas with purpose, clarity and momentum.</p>
      </section>

      <footer class="footer">
        <p>Megaplex © 2026</p>
        <span class="footer-line" aria-hidden="true"></span>
        <p>megaplex.it.com</p>
      </footer>
    </main>
  </body>
</html>
